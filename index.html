<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thu Thập Hỏi Đáp API (Bản Hoàn Hảo)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a73e8; text-align: center; border-bottom: 2px solid #e8eaed; padding-bottom: 10px; }
        .box { background: #f8f9fa; border: 1px solid #dadce0; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #1557b0; }
        #downloadBtn { background-color: #34a853; display: none; }
        #downloadBtn:hover { background-color: #2b803e; }
        #clearBtn { background-color: #ea4335; }
        #clearBtn:hover { background-color: #c5221f; }
        #preview { background: #202124; color: #e8eaed; padding: 20px; border-radius: 8px; height: 500px; overflow-y: auto; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; display: none; margin-top: 20px; border-left: 5px solid #34a853; }
        .status { margin-top: 10px; font-weight: bold; color: #d93025; }
    </style>
</head>
<body>

<div class="container">
    <h1>Thu Thập Hỏi Đáp qua REST API</h1>
    
    <div class="box">
        <p><strong>Cơ chế:</strong> Ứng dụng đọc trực tiếp dữ liệu JSON từ hệ thống, tự động ghép nối chuẩn xác 100% bằng mã ID nội bộ.</p>
        
        <div class="btn-group">
            <button onclick="fetchAndProcessAPI()">🔄 Tải & Quét Dữ liệu</button>
            <button id="downloadBtn" onclick="downloadTXT()">⬇️ Tải xuống Tệp TXT</button>
            <button id="clearBtn" onclick="clearHistory()">🗑️ Xóa Database</button>
        </div>
        <div id="statusText" class="status"></div>
    </div>

    <div id="preview"></div>
</div>

<script>
    const FETCH_URL = "/api/comments"; 
    
    let finalOutputText = "";
    
    // Khởi tạo Database từ LocalStorage
    let processedIds = new Set(JSON.parse(localStorage.getItem('processed_api_ids')) || []);
    let questionDB = JSON.parse(localStorage.getItem('api_question_db')) || {};

    async function fetchAndProcessAPI() {
        const statusText = document.getElementById('statusText');
        const previewBox = document.getElementById('preview');
        
        statusText.style.color = "#1a73e8";
        statusText.innerText = "Đang tải và đồng bộ dữ liệu JSON...";
        previewBox.style.display = "none";
        document.getElementById('downloadBtn').style.display = "none";

        try {
            const response = await fetch(FETCH_URL);
            if (!response.ok) throw new Error(`Lỗi HTTP: ${response.status}`);
            
            const comments = await response.json();
            
            if (!Array.isArray(comments) || comments.length === 0) {
                statusText.innerText = "Không tìm thấy dữ liệu hoặc link chưa trả về JSON.";
                return;
            }

            let newItemsCount = 0;
            let answers = [];
            let currentQuestions = [];

            // 1. Phân loại dữ liệu và làm sạch HTML
            comments.forEach(comment => {
                const id = comment.id;
                const parentId = comment.parent;
                const author = comment.author_name || "Khách ẩn danh";
                const date = comment.date;
                const link = comment.link;
                
                // Làm sạch HTML
                let tempDiv = document.createElement("div");
                tempDiv.innerHTML = comment.content.rendered;
                let plainText = tempDiv.innerText || tempDiv.textContent;
                plainText = plainText.trim().replace(/\n{3,}/g, '\n\n');

                let isNew = !processedIds.has(id);
                if (isNew) {
                    newItemsCount++;
                    processedIds.add(id);
                }

                const dataObj = { id, parentId, date: formatAPIDate(date), author, text: plainText, link, isNew };

                // Phân loại: Dựa vào parent hoặc tên người dùng
                if (parentId !== 0 || author.includes("东方台") || author.toLowerCase().includes("admin")) {
                    // Nếu là trả lời và là bài mới, đưa vào danh sách xuất
                    if (isNew) answers.push(dataObj);
                } else {
                    // Cập nhật câu hỏi vào Database để ghi nhớ
                    if (!questionDB[id]) {
                        questionDB[id] = dataObj;
                    }
                    if (isNew) currentQuestions.push(dataObj);
                }
            });

            // 2. Thuật toán Ghép nối chuẩn xác từ Database
            let pairedOutput = "";
            let standaloneOutput = "";

            // Xử lý các câu trả lời mới
            answers.forEach(ans => {
                // Tìm kiếm gốc rễ câu hỏi trong Database bằng ID chính xác
                let matchedQuestion = questionDB[ans.parentId];

                let block = `[🌟 BÀI TRẢ LỜI MỚI CẬP NHẬT]\n[Mã ID: ${ans.id}]\n`;
                
                if (matchedQuestion) {
                    block += `=== HỎI ===\n👤 Người hỏi: ${matchedQuestion.author} | ⏱ ${matchedQuestion.date}\n${matchedQuestion.text}\n\n`;
                    block += `=== ĐÁP ===\n👤 Người trả lời: ${ans.author} | ⏱ ${ans.date}\n${ans.text}\n`;
                } else {
                    block += `=== ĐÁP (Chưa quét được câu hỏi gốc mang ID: ${ans.parentId}) ===\n`;
                    block += `👤 Người trả lời: ${ans.author} | ⏱ ${ans.date}\n${ans.text}\n`;
                }
                block += `\n----------------------------------------------------------------------\n\n`;
                pairedOutput += block;
            });

            // Xử lý các câu hỏi mới chưa được trả lời
            currentQuestions.forEach(q => {
                let block = `[🌟 CÂU HỎI MỚI - CHỜ PHẢN HỒI]\n[Mã ID: ${q.id}]\n`;
                block += `=== HỎI ===\n👤 Người hỏi: ${q.author} | ⏱ ${q.date}\n${q.text}\n`;
                block += `\n----------------------------------------------------------------------\n\n`;
                standaloneOutput += block;
            });

            // Tổng hợp Output
            const now = new Date();
            finalOutputText = `=== BÁO CÁO HỎI ĐÁP API ĐÃ GHÉP NỐI CHÍNH XÁC ===\nNgày xuất tệp: ${now.toLocaleString('vi-VN')}\n==================================================\n\n`;
            
            if (newItemsCount === 0) {
                finalOutputText += "Chưa có bình luận hoặc câu trả lời nào mới so với lần quét trước.\n";
            } else {
                finalOutputText += pairedOutput + standaloneOutput;
            }

            // Dọn dẹp Database (giới hạn lưu 500 câu hỏi để trình duyệt không quá tải)
            const dbKeys = Object.keys(questionDB);
            if (dbKeys.length > 500) {
                const keysToRemove = dbKeys.slice(0, dbKeys.length - 500);
                keysToRemove.forEach(key => delete questionDB[key]);
            }
            
            // Lưu trạng thái vào trình duyệt
            localStorage.setItem('processed_api_ids', JSON.stringify(Array.from(processedIds)));
            localStorage.setItem('api_question_db', JSON.stringify(questionDB));

            statusText.innerText = `✅ Đã quét ${comments.length} bình luận. Phát hiện ${newItemsCount} nội dung MỚI.`;
            statusText.style.color = "#34a853";
            
            previewBox.innerHTML = finalOutputText.replace(/\[🌟 BÀI TRẢ LỜI MỚI CẬP NHẬT\]/g, '<span style="color:#fbbc04; font-weight:bold;">[🌟 BÀI TRẢ LỜI MỚI CẬP NHẬT]</span>')
                                                  .replace(/\[🌟 CÂU HỎI MỚI - CHỜ PHẢN HỒI\]/g, '<span style="color:#fbbc04; font-weight:bold;">[🌟 CÂU HỎI MỚI - CHỜ PHẢN HỒI]</span>')
                                                  .replace(/=== HỎI/g, '<span style="color:#4299e1; font-weight:bold;">=== HỎI</span>')
                                                  .replace(/=== ĐÁP/g, '<span style="color:#48bb78; font-weight:bold;">=== ĐÁP</span>');
            previewBox.style.display = "block";
            
            if (newItemsCount > 0) document.getElementById('downloadBtn').style.display = "inline-block";

        } catch (error) {
            statusText.innerText = "Lỗi kết nối. Hãy đảm bảo tệp _redirects đã được lưu thành công trên Netlify và trỏ đúng đường dẫn.";
            statusText.style.color = "red";
            console.error(error);
        }
    }

    // Chuyển đổi ngày tháng dạng ISO (2026-09-30T22:03:04)
    function formatAPIDate(dateString) {
        if(!dateString) return "Không rõ thời gian";
        try {
            const d = new Date(dateString);
            return d.toLocaleString('vi-VN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit' });
        } catch(e) { return dateString; }
    }

    function downloadTXT() {
        if (!finalOutputText) return;
        const now = new Date();
        const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours()}h${now.getMinutes()}`;
        
        const blob = new Blob([finalOutputText], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `DuLieu_GhepNoi_API_${dateStr}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function clearHistory() {
        if(confirm("Bạn có chắc muốn xóa toàn bộ bộ nhớ? Ứng dụng sẽ tính tất cả dữ liệu là mới trong lần quét kế tiếp.")) {
            localStorage.removeItem('processed_api_ids');
            localStorage.removeItem('api_question_db');
            processedIds.clear();
            questionDB = {};
            document.getElementById('statusText').innerText = "Đã dọn dẹp Database. Vui lòng quét lại.";
            document.getElementById('statusText').style.color = "#ea4335";
        }
    }
</script>

</body>
</html>
