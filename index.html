<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thu Thập Hỏi Đáp RSS (Có Bộ Nhớ)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a73e8; text-align: center; border-bottom: 2px solid #e8eaed; padding-bottom: 10px; }
        .box { background: #f8f9fa; border: 1px solid #dadce0; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #1557b0; }
        #downloadBtn { background-color: #34a853; display: none; }
        #downloadBtn:hover { background-color: #2b803e; }
        #clearBtn { background-color: #ea4335; }
        #clearBtn:hover { background-color: #c5221f; }
        #preview { background: #202124; color: #e8eaed; padding: 20px; border-radius: 8px; height: 500px; overflow-y: auto; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; display: none; margin-top: 20px; border-left: 5px solid #34a853; }
        .status { margin-top: 10px; font-weight: bold; color: #d93025; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ Thống Thu Thập Hỏi Đáp RSS</h1>
    
    <div class="box">
        <p><strong>Cơ chế hoạt động:</strong> Ứng dụng sẽ tự động ghi nhớ các câu hỏi vào bộ nhớ trình duyệt để chờ ghép nối với câu trả lời trong các lần quét sau.</p>
        
        <div class="btn-group">
            <button onclick="fetchAndProcessRSS()">🔄 Tải & Xử lý Dữ liệu Mới</button>
            <button id="downloadBtn" onclick="downloadTXT()">⬇️ Tải xuống Tệp TXT</button>
            <button id="clearBtn" onclick="clearHistory()">🗑️ Xóa toàn bộ bộ nhớ</button>
        </div>
        <div id="statusText" class="status"></div>
    </div>

    <div id="preview"></div>
</div>

<script>
    const FETCH_URL = "/api/rss"; // Giữ nguyên cấu hình proxy của Netlify
    
    let finalOutputText = "";
    let processedGuids = new Set(JSON.parse(localStorage.getItem('processed_rss_guids')) || []);
    let questionDB = JSON.parse(localStorage.getItem('question_db')) || [];

    async function fetchAndProcessRSS() {
        const statusText = document.getElementById('statusText');
        const previewBox = document.getElementById('preview');
        
        statusText.style.color = "#1a73e8";
        statusText.innerText = "Đang phân tích và truy xuất dữ liệu ghép nối...";
        previewBox.style.display = "none";
        document.getElementById('downloadBtn').style.display = "none";

        try {
            const response = await fetch(FETCH_URL);
            if (!response.ok) throw new Error(`Lỗi HTTP: ${response.status}`);
            
            const textContent = await response.text();
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(textContent, "text/xml");
            
            const items = Array.from(xmlDoc.querySelectorAll("item"));
            if (items.length === 0) {
                statusText.innerText = "Không tìm thấy dữ liệu.";
                return;
            }

            let questions = [];
            let answers = [];
            let newItemsCount = 0;

            // 1. Phân loại và Cập nhật Bộ nhớ Câu hỏi
            items.forEach(item => {
                const link = item.querySelector("link") ? item.querySelector("link").textContent.trim() : "";
                const guidNode = item.querySelector("guid");
                const guid = guidNode ? guidNode.textContent.trim() : link;
                const pubDate = item.querySelector("pubDate") ? item.querySelector("pubDate").textContent.trim() : "";
                const creatorNode = item.getElementsByTagNameNS("*", "creator")[0];
                const creator = creatorNode ? creatorNode.textContent.trim() : "Khách ẩn danh";
                const contentNode = item.getElementsByTagNameNS("*", "encoded")[0] || item.querySelector("description");
                let htmlContent = contentNode ? contentNode.textContent : "";
                
                let tempDiv = document.createElement("div");
                tempDiv.innerHTML = htmlContent;
                
                let replyLink = null;
                let replyToName = null;
                const linkElement = tempDiv.querySelector('a');
                if (linkElement && htmlContent.includes('回复给')) {
                    replyLink = linkElement.href;
                    replyToName = linkElement.textContent;
                }

                let plainText = tempDiv.innerText || tempDiv.textContent;
                plainText = plainText.trim().replace(/\n{3,}/g, '\n\n');

                let isNew = !processedGuids.has(guid);
                if (isNew) {
                    newItemsCount++;
                    processedGuids.add(guid);
                }

                const dataObj = { guid, link, pubDate: formatDate(pubDate), creator, text: plainText, isNew, replyLink, replyToName };

                if (creator.includes("东方台") || creator.toLowerCase().includes("admin")) {
                    // Chỉ xử lý câu trả lời MỚI để xuất ra file
                    if (isNew) answers.push(dataObj);
                } else {
                    // Lưu mọi câu hỏi vào DB (nếu chưa có) để chờ trả lời
                    if (!questionDB.some(q => q.link === link)) {
                        questionDB.push(dataObj);
                    }
                    if (isNew) questions.push(dataObj);
                }
            });

            // Giữ cho Database câu hỏi không quá lớn (Lưu 500 câu gần nhất)
            if (questionDB.length > 500) questionDB = questionDB.slice(-500);
            
            // Lưu lại vào trình duyệt
            localStorage.setItem('processed_rss_guids', JSON.stringify(Array.from(processedGuids)));
            localStorage.setItem('question_db', JSON.stringify(questionDB));

            // 2. Thuật toán Ghép nối thông minh từ Database
            let pairedOutput = "";
            let standaloneOutput = "";

            answers.forEach(ans => {
                // Lục tìm câu hỏi trong toàn bộ Database đã lưu (Không chỉ trong 10 bài hiện tại)
                let matchedQuestion = questionDB.find(q => q.link === ans.replyLink);

                let block = `[🌟 BÀI TRẢ LỜI MỚI CẬP NHẬT]\n[Mã bài: ${ans.guid}]\n`;
                
                if (matchedQuestion) {
                    block += `=== HỎI ===\n👤 Người hỏi: ${matchedQuestion.creator} | ⏱ ${matchedQuestion.pubDate}\n${matchedQuestion.text}\n\n`;
                    block += `=== ĐÁP ===\n👤 Người trả lời: ${ans.creator} | ⏱ ${ans.pubDate}\n${ans.text}\n`;
                } else {
                    block += `=== ĐÁP (Chưa quét được câu hỏi gốc) ===\n`;
                    if (ans.replyToName) block += `📌 Đang trả lời cho: ${ans.replyToName} (Link: ${ans.replyLink})\n`;
                    block += `👤 Người trả lời: ${ans.creator} | ⏱ ${ans.pubDate}\n${ans.text}\n`;
                }
                block += `\n----------------------------------------------------------------------\n\n`;
                pairedOutput += block;
            });

            questions.forEach(q => {
                let block = `[🌟 CÂU HỎI MỚI - CHỜ PHẢN HỒI]\n[Mã bài: ${q.guid}]\n`;
                block += `=== HỎI ===\n👤 Người hỏi: ${q.creator} | ⏱ ${q.pubDate}\n${q.text}\n`;
                block += `\n----------------------------------------------------------------------\n\n`;
                standaloneOutput += block;
            });

            // 3. Tổng hợp Output (Chỉ hiển thị cập nhật mới)
            const now = new Date();
            finalOutputText = `=== BÁO CÁO HỎI ĐÁP RSS CẬP NHẬT ===\nNgày xuất tệp: ${now.toLocaleString('vi-VN')}\n==================================================\n\n`;
            
            if (newItemsCount === 0) {
                finalOutputText += "Không có câu hỏi hoặc câu trả lời nào mới so với lần quét trước.\n";
            } else {
                finalOutputText += pairedOutput + standaloneOutput;
            }

            statusText.innerText = `✅ Đã quét ${items.length} mục. Phát hiện ${newItemsCount} mục MỚI.`;
            statusText.style.color = "#34a853";
            
            previewBox.innerHTML = finalOutputText.replace(/\[🌟 BÀI TRẢ LỜI MỚI CẬP NHẬT\]/g, '<span style="color:#fbbc04; font-weight:bold;">[🌟 BÀI TRẢ LỜI MỚI CẬP NHẬT]</span>')
                                                  .replace(/\[🌟 CÂU HỎI MỚI - CHỜ PHẢN HỒI\]/g, '<span style="color:#fbbc04; font-weight:bold;">[🌟 CÂU HỎI MỚI - CHỜ PHẢN HỒI]</span>')
                                                  .replace(/=== HỎI/g, '<span style="color:#4299e1; font-weight:bold;">=== HỎI</span>')
                                                  .replace(/=== ĐÁP/g, '<span style="color:#48bb78; font-weight:bold;">=== ĐÁP</span>');
            previewBox.style.display = "block";
            
            if (newItemsCount > 0) document.getElementById('downloadBtn').style.display = "inline-block";

        } catch (error) {
            statusText.innerText = "Lỗi khi lấy dữ liệu. Hãy đảm bảo bạn đã cấu hình _redirects trên Netlify.";
            statusText.style.color = "red";
        }
    }

    function formatDate(dateString) {
        if(!dateString) return "Không rõ thời gian";
        try {
            const d = new Date(dateString);
            return d.toLocaleString('vi-VN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit' });
        } catch(e) { return dateString; }
    }

    function downloadTXT() {
        if (!finalOutputText) return;
        const now = new Date();
        const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours()}h${now.getMinutes()}`;
        
        const blob = new Blob([finalOutputText], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `CapNhat_HoiDap_${dateStr}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function clearHistory() {
        if(confirm("Bạn có chắc muốn xóa toàn bộ bộ nhớ câu hỏi và lịch sử quét? Ứng dụng sẽ phải bắt đầu học lại từ đầu.")) {
            localStorage.removeItem('processed_rss_guids');
            localStorage.removeItem('question_db');
            processedGuids.clear();
            questionDB = [];
            document.getElementById('statusText').innerText = "Đã xóa toàn bộ dữ liệu. Vui lòng chạy lại.";
            document.getElementById('statusText').style.color = "#ea4335";
        }
    }
</script>

</body>
</html>
